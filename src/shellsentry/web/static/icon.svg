<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="terminalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Shield Background -->
  <path d="M60 8 L102 28 L102 68 Q102 98 60 112 Q18 98 18 68 L18 28 Z" fill="url(#shieldGrad)" stroke="#7f1d1d" stroke-width="2"/>
  <!-- Terminal Window -->
  <rect x="28" y="30" width="64" height="52" rx="6" fill="url(#terminalGrad)" stroke="#334155" stroke-width="1.5"/>
  <!-- Terminal Title Bar -->
  <rect x="28" y="30" width="64" height="10" rx="6" fill="#334155"/>
  <rect x="28" y="36" width="64" height="4" fill="#334155"/>
  <circle cx="35" cy="35" r="2.5" fill="#ef4444"/>
  <circle cx="42" cy="35" r="2.5" fill="#f59e0b"/>
  <circle cx="49" cy="35" r="2.5" fill="#10b981"/>
  <!-- Code Lines -->
  <line x1="34" y1="46" x2="62" y2="46" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="34" y1="52" x2="78" y2="52" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="58" x2="55" y2="58" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="64" x2="70" y2="64" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="34" y1="70" x2="50" y2="70" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Cursor -->
  <rect x="52" y="68" width="6" height="4" rx="1" fill="#e2e8f0" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <!-- AI Sparkle -->
  <circle cx="88" cy="42" r="5" fill="#f59e0b" opacity="0.9" filter="url(#glow)"/>
  <circle cx="92" cy="36" r="2.5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="84" cy="34" r="1.5" fill="#fbbf24" opacity="0.5"/>
  <!-- Crosshair -->
  <circle cx="60" cy="60" r="18" fill="none" stroke="rgba(220,38,38,0.3)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="60" y1="44" x2="60" y2="76" stroke="rgba(220,38,38,0.15)" stroke-width="0.5"/>
  <line x1="44" y1="60" x2="76" y2="60" stroke="rgba(220,38,38,0.15)" stroke-width="0.5"/>
</svg>
